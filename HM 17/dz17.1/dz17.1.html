<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="dz17.1.css">
    <title>Калькулятор</title>
</head>
<body>
    <div class="calculator">
        <h1>Калькулятор</h1>
        <input type="number" id="number1" placeholder="Перше число">
        <input type="number" id="number2" placeholder="Друге число">
        <button onclick="performOperation('add')">Додати</button>
        <button onclick="performOperation('subtract')">Відняти</button>
        <button onclick="performOperation('multiply')">Помножити</button>
        <button onclick="performOperation('divide')">Ділити</button>
        <p id="result"></p>
    </div>
    <script src="dz17.1.js"></script>

</body>
</html>
